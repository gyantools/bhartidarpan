name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: रिपॉज़िटरी लो
        uses: actions/checkout@v4
      - name: ज़िप खोलो
        run: unzip -o bhartidarpan-website.zip -d site
      - name: पेजेस सेटअप
        uses: actions/configure-pages@v5
      - name: फाइलें अपलोड करो
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: लाइव करो
        id: deployment
        uses: actions/deploy-pages@v4
        
